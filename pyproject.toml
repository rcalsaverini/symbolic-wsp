[project]
name = "symbolic-wsp"
version = "0.1.0"
description = "Independent gradient-free weight editing and symbolic optimization workbench"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "safetensors>=0.4"]
[project.optional-dependencies]
hf = ["torch>=2.2", "transformers>=4.45,<5"]
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]
[project.scripts]
symbolic-wsp = "symbolic_wsp.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
